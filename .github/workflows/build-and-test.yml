# Validation complète sur runner macOS hébergé par GitHub. Couvre les étapes 2
# à 8 du protocole de validation finale : résolution, build Debug, build
# Release, les 34 tests XCTest (20 domaine, 9 formats, 5 composants),
# vérification des avertissements, lint.
#
# Ce workflow est la porte de qualité du dépôt. Il tourne sur les pull requests
# autant que sur `main` : sans ce déclencheur, une régression n'était détectée
# qu'après fusion, les 34 tests ne protégeant aucune revue.
name: Build et tests Nutristack

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

env:
  # Destination unique pour les trois étapes xcodebuild. Sans `OS=`, xcodebuild
  # répond « Using the first of multiple matching destinations » et choisit un
  # runtime arbitraire, qui change avec l'image du runner : on ne validait plus
  # la cible documentée (iPhone 15 / iOS 17, Protocole_Validation_Finale_v1.0).
  DESTINATION: platform=iOS Simulator,name=iPhone 15,OS=17.5

jobs:
  build-and-test:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5

      - name: Sélectionner Xcode 15
        run: sudo xcode-select -switch /Applications/Xcode_15.4.app

      # Trace les runtimes réellement installés sous cet Xcode. La destination
      # ci-dessus épingle une version d'iOS ; si l'image du runner cesse de la
      # fournir, ce journal donne la réponse sans nouvelle enquête.
      - name: Inventorier les simulateurs disponibles
        run: xcrun simctl list runtimes

      - name: Vérifier les 5 polices
        run: |
          DIR="Packages/NutristackDesignSystem/Sources/NutristackDesignSystem/Resources/Fonts"
          for name in Regular Medium SemiBold Bold ExtraBold; do
            test -f "$DIR/SchibstedGrotesk-$name.ttf" || { echo "::error::police manquante : $name"; exit 1; }
          done
          echo "5 polices présentes"

      - name: Installer l'outillage épinglé
        uses: ./.github/actions/toolchain

      # Le protocole de validation désigne `./scripts/bootstrap.sh`, qui est un
      # script de poste de travail : il se termine par `open Nutristack.xcodeproj`,
      # sans objet sur un runner sans session graphique. On appelle donc
      # directement la seule commande utile en CI, celle que bootstrap.sh exécute.
      - name: Générer le projet (étape 2)
        run: xcodegen generate

      - name: Résoudre les dépendances (étape 3)
        run: xcodebuild -resolvePackageDependencies -project Nutristack.xcodeproj

      - name: Lint strict
        run: swiftlint --strict

      - name: Build Debug, cible complète (étape 4)
        run: |
          xcodebuild build -project Nutristack.xcodeproj -scheme Nutristack \
            -configuration Debug -destination "$DESTINATION" \
            | xcpretty && exit ${PIPESTATUS[0]}

      - name: Build Release, cible complète (étape 5)
        run: |
          xcodebuild build -project Nutristack.xcodeproj -scheme Nutristack \
            -configuration Release -destination "$DESTINATION" \
            | xcpretty && exit ${PIPESTATUS[0]}

      - name: Exécuter les 34 tests XCTest (étapes 6 et 7)
        id: tests
        run: |
          xcodebuild test -project Nutristack.xcodeproj -scheme Nutristack \
            -destination "$DESTINATION" \
            -resultBundlePath build/reports/Nutristack.xcresult \
            | xcpretty --test && exit ${PIPESTATUS[0]}

      # Publié en succès comme en échec, mais seulement si l'étape de test a
      # bien tourné : conditionner sur `always()` seul faisait échouer la
      # publication quand un build amont s'arrêtait avant d'écrire le bundle.
      # `if-no-files-found: error` empêche le retour du défaut d'origine, un
      # chemin inexistant publié en silence sous un simple avertissement.
      - name: Publier le rapport de tests
        if: steps.tests.conclusion != 'skipped'
        uses: actions/upload-artifact@v5
        with:
          name: resultats-tests
          path: build/reports
          if-no-files-found: error
