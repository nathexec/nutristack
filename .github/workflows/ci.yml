# Porte rapide (Plan §2, porte M1) : les deux paquets locaux, testés avec
# `swift test` sur l'hôte macOS. C'est plus rapide qu'un simulateur et cela
# évite de dépendre d'un schéma Xcode que XcodeGen ne génère pas pour les
# paquets locaux.
#
# Le lint, la génération du projet et la compilation de l'app vivaient aussi
# ici. Ils ont été retirés : `build-and-test.yml` les exécute déjà sur les
# mêmes déclencheurs, et cette duplication doublait le coût runner comme le
# nombre de points de panne pour un résultat identique.
name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test-packages:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      # Même version d'Xcode que build-and-test.yml : sans cette sélection, le
      # job compilait avec l'Xcode par défaut du runner, qui change avec l'image.
      - name: Sélectionner Xcode 15
        run: sudo xcode-select -switch /Applications/Xcode_15.4.app
      - name: Tests du domaine
        run: swift test --package-path Packages/NutristackDomain
      - name: Tests du design system
        run: swift test --package-path Packages/NutristackDesignSystem
